# Management addresses of the lab devices (same plan in every lab).
# Only the devices that exist in your current lab will answer.
defaults:
  user: cumulus
  password: "CumulusLab1!"      # or export CGR_PASSWORD=...
  platform: cumulus             # cumulus = NVUE REST API | frr = lite container (SSH)

devices:
  # lab00
  sw1:   {host: 192.168.100.11}
  sw2:   {host: 192.168.100.12}
  # lab01 (campus)
  dist1: {host: 192.168.100.21}
  acc1:  {host: 192.168.100.22}
  acc2:  {host: 192.168.100.23}
  # lab02 / lab03 (OSPF, IS-IS)
  r1:    {host: 192.168.100.31}
  r2:    {host: 192.168.100.32}
  r3:    {host: 192.168.100.33, platform: frr}
  r4:    {host: 192.168.100.34, platform: frr}
  # lab04 (BGP)
  e1:    {host: 192.168.100.41}
  e2:    {host: 192.168.100.42}
  isp1:  {host: 192.168.100.43, platform: frr}
  isp2:  {host: 192.168.100.44, platform: frr}
