# Fallback inventory (Ansible YAML format).
# Every lab built with tools/cgr_lab.py writes its own /root/lab/inventory.yml on the netauto
# node; the scripts and ansible.cfg use that one automatically. This file is only used when it
# is missing (or with -i inventory.yml).
all:
  vars:
    ansible_user: cgr
    ansible_password: cgrlab       # or export CGR_PASSWORD=... for the Python scripts
    ansible_python_interpreter: /usr/bin/python3
  children:
    lab00:
      hosts:
        sw1: {ansible_host: 192.168.100.11}
        sw2: {ansible_host: 192.168.100.12}
    lab03:
      hosts:
        r1: {ansible_host: 192.168.100.31}
        r2: {ansible_host: 192.168.100.32}
        r3: {ansible_host: 192.168.100.33}
        r4: {ansible_host: 192.168.100.34}
