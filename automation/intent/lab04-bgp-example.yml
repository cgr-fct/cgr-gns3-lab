# Example intent for lab04 (partial!) - shows OSPF underlay + iBGP/eBGP.
# Complete it as part of Lab 05 (automation).
description: "Enterprise AS 65000 edge routers"
devices:
  e1:
    hostname: e1
    loopback: 10.255.4.1/32
    interfaces:
      swp1: {mode: routed, ip: 10.4.12.1/30, description: "to e2"}
      swp2: {mode: routed, ip: 198.51.100.2/30, description: "to isp1"}
      swp3: {mode: routed, ip: 192.0.2.1/25, description: "LAN"}
    ospf:
      router_id: 10.255.4.1
      interfaces:
        lo:   {area: 0, passive: true}
        swp1: {area: 0, network_type: point-to-point}
        swp3: {area: 0, passive: true}
    bgp:
      asn: 65000
      router_id: 10.255.4.1
      networks: [192.0.2.0/25]
      neighbors:
        198.51.100.1: {remote_as: 65101, description: "ISP1"}
        10.255.4.2:   {remote_as: internal, update_source: lo, next_hop_self: true}
  # e2: TODO - complete it (ISP2 is 198.51.100.5, AS 65102)
