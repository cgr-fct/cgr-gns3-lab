# Lab 00 intent: VLAN 10 stretched across sw1 and sw2.
# Each device entry is the content of the YANG container cgr-device:device
# (see yang/cgr-device@2026-09-15.yang or: pyang -f tree yang/cgr-device@2026-09-15.yang)
devices:
  sw1:
    hostname: sw1
    loopback: [10.255.0.1/32]
    bridge:
      vlans: [10]
    interface:
      - name: swp1
        description: to sw2
        mode: trunk
        trunk-vlans: [10]
      - name: swp2
        description: pc1
        mode: access
        access-vlan: 10
  sw2:
    hostname: sw2
    loopback: [10.255.0.2/32]
    bridge:
      vlans: [10]
    interface:
      - name: swp1
        description: to sw1
        mode: trunk
        trunk-vlans: [10]
      - name: swp2
        description: pc2
        mode: access
        access-vlan: 10
