frr defaults traditional
hostname isp2
log syslog informational
service integrated-vtysh-config
!
! ISP2 - AS 65102. Customer: AS 65000 (192.0.2.0/24 and more-specifics up to /25)
ip prefix-list CUST-AS65000 seq 5 permit 192.0.2.0/24 le 25
!
bgp community-list standard CUST-BACKUP seq 5 permit 65102:80
!
route-map CUSTOMER-IN permit 10
 match ip address prefix-list CUST-AS65000
 match community CUST-BACKUP
 set local-preference 80
exit
route-map CUSTOMER-IN permit 20
 match ip address prefix-list CUST-AS65000
 set local-preference 200
exit
!
route-map ALL permit 10
exit
!
router bgp 65102
 bgp router-id 10.255.102.1
 neighbor 198.51.100.6 remote-as 65000
 neighbor 198.51.100.6 description customer-e2
 neighbor 198.51.100.9 remote-as 65101
 neighbor 198.51.100.9 description peer-isp1
 !
 address-family ipv4 unicast
  network 203.0.113.0/24
  neighbor 198.51.100.6 default-originate
  neighbor 198.51.100.6 route-map CUSTOMER-IN in
  neighbor 198.51.100.6 route-map ALL out
  neighbor 198.51.100.9 route-map ALL in
  neighbor 198.51.100.9 route-map ALL out
 exit-address-family
exit
!
end
