# Lab 04 - BGP: eBGP to two providers, iBGP, policy (local-pref, AS-path prepend, communities)
name: lab04-bgp
nodes:
  e1:      {kind: frr,     mgmt: 192.168.100.41, x: -180, y: 0}
  e2:      {kind: frr,     mgmt: 192.168.100.42, x: 180,  y: 0}
  isp1:    {kind: frr, mgmt: 192.168.100.43, x: -180, y: -220,
            interfaces: configs/isp1.interfaces, frr_config: configs/isp1.frr.conf}
  isp2:    {kind: frr, mgmt: 192.168.100.44, x: 180,  y: -220,
            interfaces: configs/isp2.interfaces, frr_config: configs/isp2.frr.conf}
  pc1:     {kind: vpcs, ip: 192.0.2.10/25,  gw: 192.0.2.1,   x: -180, y: 200}
  pc2:     {kind: vpcs, ip: 192.0.2.130/25, gw: 192.0.2.129, x: 180,  y: 200}
  srv:     {kind: vpcs, ip: 203.0.113.10/24, gw: 203.0.113.1, x: 400, y: -220}
  netauto: {kind: netauto, mgmt: 192.168.100.10, x: -450, y: -80}
links:
  - [e1:swp1, e2:swp1]        # 10.4.12.0/30        iBGP / OSPF underlay
  - [e1:swp2, isp1:swp1]      # 198.51.100.0/30     eBGP AS65000-AS65101
  - [e2:swp2, isp2:swp1]      # 198.51.100.4/30     eBGP AS65000-AS65102
  - [isp1:swp2, isp2:swp2]    # 198.51.100.8/30     provider peering
  - [e1:swp3, pc1:e0]         # 192.0.2.0/25
  - [e2:swp3, pc2:e0]         # 192.0.2.128/25
  - [isp2:swp3, srv:e0]       # 203.0.113.0/24      "the Internet"
