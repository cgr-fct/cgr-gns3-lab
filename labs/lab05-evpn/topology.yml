# Lab 05 - EVPN-VXLAN data-center fabric (2nd project, 2026/2027)
# Leaf-spine: every leaf has swp1 -> spine1, swp2 -> spine2; spineN swpK -> leafK. Hosts on swp3/swp4.
name: lab05-evpn
mgmt_subnet: 192.168.200.0/24
mgmt_switch_pos: [-760, -420]
nodes:
  spine1: {kind: frr, role: router, mgmt: 192.168.200.31, ports: 5, x: -200, y: -300}
  spine2: {kind: frr, role: router, mgmt: 192.168.200.32, ports: 5, x: 200, y: -300}
  leaf1: {kind: frr, role: switch, mgmt: 192.168.200.41, ports: 5, x: -480, y: 0}
  leaf2: {kind: frr, role: switch, mgmt: 192.168.200.42, ports: 5, x: -160, y: 0}
  leaf3: {kind: frr, role: switch, mgmt: 192.168.200.43, ports: 5, x: 160, y: 0}
  leaf4: {kind: frr, role: switch, mgmt: 192.168.200.44, ports: 5, x: 480, y: 0}
  h1: {kind: host, ip: 192.168.10.11/24, gw: 192.168.10.1, x: -560, y: 250}
  h5: {kind: host, ip: 192.168.10.15/24, gw: 192.168.10.1, x: -400, y: 250}
  h2: {kind: host, ip: 192.168.20.12/24, gw: 192.168.20.1, x: -160, y: 250}
  h3: {kind: host, ip: 192.168.10.13/24, gw: 192.168.10.1, x: 160, y: 250}
