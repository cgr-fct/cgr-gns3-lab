- ['leaf2:swp2', 'spine2:swp2']
- ['leaf3:swp1', 'spine1:swp3']
- ['leaf3:swp2', 'spine2:swp3']
- ['leaf4:swp1', 'spine1:swp4']
- ['leaf4:swp2', 'spine2:swp4']
