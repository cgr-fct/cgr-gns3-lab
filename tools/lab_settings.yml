# Settings shared by all labs.

# Container images used in the labs (multi-arch: amd64 + arm64)
frr_image: ghcr.io/cgr-fct/cgr-frr:latest
netauto_image: ghcr.io/cgr-fct/cgr-netauto:latest

# Out-of-band management network (labs can override it with mgmt_subnet)
mgmt_subnet: 192.168.100.0/24

# Login of the router/switch nodes (set in images/frr/Dockerfile)
user: cgr
password: cgrlab
